name: Ingest News Articles
on:
  # Lets you click "Run workflow" manually in GitHub's Actions tab -- also
  # what the external scheduler (cron-job.org) calls via the REST API.
  workflow_dispatch:
  # NATIVE CRON DISABLED (2026-08-01): moved to an external scheduler
  # (cron-job.org) calling workflow_dispatch on a reliable timer, after
  # confirmed multi-day silent gaps from GitHub's native schedule trigger
  # not firing reliably. Left here, commented out, in case of a future
  # rollback -- do not re-enable alongside the external scheduler, or the
  # job will run twice on overlapping schedules.
  # schedule:
  #   - cron: '17 */3 * * *'
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: node ingest.js
